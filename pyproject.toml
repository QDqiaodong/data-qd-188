[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "data-qd-188"
version = "0.1.0"
description = "围棋棋谱合法回放与盘面区域"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
go-record = "go_record.cli:main"
go-record-archive = "go_record.archive_cli:main"

[tool.setuptools.packages.find]
where = ["src"]
